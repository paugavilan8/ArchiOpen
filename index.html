<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArchiOpen</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M2 13C5 2 11 14 14 3%22 fill=%22none%22 stroke=%22%231f6fb5%22 stroke-width=%222%22/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header id="command-area">
        <div id="cmd-history"></div>
        <div id="cmd-row">
          <span id="cmd-prompt"></span>
          <input id="cmd-input" autocomplete="off" spellcheck="false" />
          <ul id="cmd-suggest" hidden></ul>
        </div>
      </header>
      <aside id="toolbar"></aside>
      <main id="viewports"></main>
      <aside id="side"></aside>
      <footer id="osnap-bar"></footer>
      <footer id="status-bar"></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

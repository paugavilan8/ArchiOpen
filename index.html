<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArchiOpen</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  </head>
  <body>
    <div id="app">
      <header id="menubar">
        <div class="brand"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 16C6 3 12 17 17 4" /></svg>ArchiOpen</div>
        <nav id="menus"></nav>
        <div id="doc-title"></div>
      </header>
      <section id="command-area">
        <div id="cmd-history" aria-live="polite"></div>
        <div id="cmd-row">
          <span id="cmd-prompt"></span>
          <input id="cmd-input" autocomplete="off" spellcheck="false" aria-label="Command line" />
          <ul id="cmd-suggest" hidden></ul>
        </div>
      </section>
      <div id="standard-bar"></div>
      <aside id="toolbar"></aside>
      <main id="viewports"></main>
      <aside id="side"></aside>
      <footer id="status-bar"></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

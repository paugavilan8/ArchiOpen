# Builds the desktop installers and publishes them as GitHub releases, which anyone can download
# from the Releases page without signing in.
#
# - Merging a change to the version in package.json (or to this workflow) into master publishes
#   that version if it has no release yet: the tag
#   (v<version>) and the release are made here.
# - Pushing a tag such as v0.5.0 (on a commit with that version) publishes it too.
# - Running it by hand from the Actions tab, or a pull request changing this workflow, only builds,
#   as downloadable artifacts.
name: Desktop app

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [package.json, .github/workflows/desktop.yml]
    tags: ['v*']
  pull_request:
    paths: [.github/workflows/desktop.yml]

permissions:
  contents: write

jobs:
  # Works out whether this run publishes a release, and of which version.
  plan:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # A release must be built from the version it is named after.
            if [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
              echo "::error::The tag ${GITHUB_REF_NAME} does not match the project version ${version}. Merge the version bump first, then tag that commit."
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" > /dev/null 2>&1; then
            echo "Release ${tag} already exists; nothing to publish."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version ${version} has no release yet: publishing ${tag}."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.name }}
    needs: plan
    # On master, only when there is a new version to publish.
    if: github.event_name != 'push' || github.ref_type == 'tag' || needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          # Macs with an Intel processor: built on the same runner for the other architecture.
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updates (the app checks them with the public key in tauri.conf.json); the
          # release then gets a latest.json the installed apps look for.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Releases make their tag on this commit if it does not exist yet; manual runs just build.
          tagName: ${{ needs.plan.outputs.release == 'true' && needs.plan.outputs.tag || '' }}
          releaseName: ArchiOpen ${{ needs.plan.outputs.tag }}
          releaseCommitish: ${{ github.sha }}
          releaseBody: Installers for Windows (.exe, .msi), macOS (.dmg, aarch64 for Apple processors and x64 for Intel) and Linux (.AppImage, .deb, .rpm). See the [changelog](https://github.com/paugavilan8/ArchiOpen/blob/master/CHANGELOG.md) for what is new.
          releaseDraft: false
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: ArchiOpen-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target && format('{0}/', matrix.target) || '' }}release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target && format('{0}/', matrix.target) || '' }}release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target && format('{0}/', matrix.target) || '' }}release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target && format('{0}/', matrix.target) || '' }}release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target && format('{0}/', matrix.target) || '' }}release/bundle/appimage/*.AppImage
          if-no-files-found: error
